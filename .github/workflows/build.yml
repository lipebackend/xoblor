name: Build xoblor.rbxl

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar xoblor.rbxl (Rojo via setup.sh)
        run: ./setup.sh build

      - name: Publicar na release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build automático da main em ${GITHUB_SHA::7}. Baixe o xoblor.rbxl e abra no Roblox Studio (File > Open from File)."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "xoblor (main ${GITHUB_SHA::7})" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create latest --title "xoblor (main ${GITHUB_SHA::7})" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          gh release upload latest xoblor.rbxl --clobber
