# CI do xoblor: formatação (StyLua), lint (selene) e build do place com Rojo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (StyLua + selene)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-rokit não publica tag de versão maior (v0); fixado na versão exata.
      - name: Instalar ferramentas (Rokit)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: "true"

      - name: Verificar formatação (StyLua)
        run: stylua --check src

      - name: Lint (selene)
        run: selene src

  build:
    name: Build (Rojo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar ferramentas (Rokit)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: "true"

      - name: Gerar xoblor.rbxl
        run: rojo build default.project.json -o xoblor.rbxl

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: xoblor-rbxl
          path: xoblor.rbxl
          if-no-files-found: error
          retention-days: 14
