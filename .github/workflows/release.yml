# Release automático: ao enviar uma tag v* (ex.: v0.1.0), gera o place e cria a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar ferramentas (Rokit)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: "true"

      - name: Verificar formatação e lint
        run: |
          stylua --check src
          selene src

      - name: Gerar xoblor.rbxl
        run: rojo build default.project.json -o xoblor.rbxl

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: xoblor.rbxl
          generate_release_notes: true
          fail_on_unmatched_files: true
