# Atualizações automáticas das actions usadas nos workflows.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Maceio
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
